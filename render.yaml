services:
  - type: web
    name: n-atlas-studio-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROVIDER
        value: gradio
      - key: MODEL_NAME
        value: NCAIR1/N-ATLaS
      - key: GRADIO_SPACE
        value: seun-ajayi/n-atlas-evaluations
      - key: GRADIO_MODEL_KEY
        value: N-ATLaS-LLM

  - type: web
    name: n-atlas-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/ui/studio.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: n-atlas-studio-api
          property: hostport
